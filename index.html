
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>


    <main class="container">

        <header>
            <h2>TODAY'sWeather<span>.</span></h2>
            <p>WEATHER AT A GLANCE</p>
        </header>

        <section class="search">
            <input type="text" id="city" placeholder="Search city...">
            <button onclick="fetchweatherData()">Search</button>
        </section>

        <section id="weather">

            <div class="location">
                <span>YOUR LOCATION</span>
                <!-- <h2 id="cityName">Kakkanad</h2> -->
            </div>

            <img id="icon" src="" alt="Weather icon">

            <h1 id="temperature">--°</h1>
            <p id="description">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>FEELS LIKE</span>
                    <h3><span id="feelsLike">--</span>°C</h3>
                </div>

                <div class="detail">
                    <span>HUMIDITY</span>
                    <h3><span id="humidity">--</span>%</h3>
                </div>

                <div class="detail">
                    <span>WIND SPEED</span>
                    <h3><span id="wind">--</span> m/s</h3>
                </div>

            </div>

        </section>

        <p id="error"></p>

    </main>

</body>
<script>
  async function fetchweatherData() {

    try {

        const city = document.getElementById("city").value;

        const response = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=8ac5c4d57ba6a4b3dfcf622700447b1e&units=metric`
        );

        const weatherData = await response.json();

        console.log(weatherData);

        document.getElementById("weather").innerHTML = `

            <h2>${weatherData.name}</h2>

            <h1>${weatherData.main.temp}°C</h1>

            <p>${weatherData.weather[0].description}</p>

            <p>Humidity: ${weatherData.main.humidity}%</p>

            <p>Wind: ${weatherData.wind.speed} m/s</p>

        `;

    } catch (error) {

        console.log(error);

    }

}

    </script>
</html>
